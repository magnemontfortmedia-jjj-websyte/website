<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Magne Montfort</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      color: #111111;
      font-family: 'Inter', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }
    .logo {
      width: 240px;
      max-width: 80%;
      height: auto;
      margin: 0 auto 40px auto;
      display: block;
    }
    .thank-you {
      font-size: 18px;
      font-weight: 400;
      color: #111111;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .early-access {
      font-size: 15px;
      font-weight: 400;
      color: #444444;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .footer-note {
      font-size: 14px;
      font-weight: 400;
      color: #555555;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/images/poo.png" alt="Magne Montfort" class="logo">
    <p class="thank-you">Thank you for joining the waitlist.</p>
    <p class="early-access">Since you signed up early, you will get early access 1 hour before the world does.</p>
    <p class="footer-note">Keep an eye on your inbox.</p>
  </div>
</body>
</html>
